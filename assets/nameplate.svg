<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="cvBuilderPaperTitle">
  <title id="cvBuilderPaperTitle">CV Builder — a considered workspace for your next career move</title>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc" />
      <stop offset="1" stop-color="#eef2f6" />
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.05" />
    </pattern>
    <filter id="sheetShadow" x="-10%" y="-12%" width="120%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14" />
    </filter>
    <clipPath id="sheetClip">
      <rect x="64" y="44" width="1152" height="332" rx="12" />
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1280" height="420" fill="url(#desk)" />
  <rect x="0" y="0" width="1280" height="420" fill="url(#dots)" />

  <g filter="url(#sheetShadow)">
    <rect x="64" y="44" width="1152" height="332" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  </g>

  <g clip-path="url(#sheetClip)">
    <rect x="64" y="44" width="10" height="332" fill="#1d6ff2" />

    <rect x="110" y="84" width="44" height="44" rx="12" fill="#0f172a" />
    <text x="132" y="114" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">C</text>

    <text x="168" y="116" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#0f172a" letter-spacing="-0.3">CV Builder</text>

    <rect x="356" y="90" width="66" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <text x="389" y="109" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#64748b">v1.1.1</text>

    <rect x="1036" y="90" width="112" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
    <text x="1092" y="109" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="12" fill="#64748b" letter-spacing="2">1 / 1</text>

    <text x="110" y="161" font-family="'Courier New', Courier, monospace" font-size="12.5" font-weight="700" fill="#1d6ff2" letter-spacing="3.2">RESUME BUILDER · ATS REVIEW · PDF &amp; DOCX EXPORT</text>

    <line x1="110" y1="190" x2="1170" y2="190" stroke="#e2e8f0" stroke-width="1" />
    <line x1="110" y1="190" x2="250" y2="190" stroke="#1d6ff2" stroke-width="3" />

    <text x="110" y="223" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#475569">A considered workspace for your next career move — build, preview, and export in the browser.</text>

    <g fill="#cbd5e1">
      <rect x="110" y="248" width="120" height="9" rx="4.5" />
      <rect x="760" y="248" width="90" height="9" rx="4.5" />
    </g>
    <g fill="#eef2f7">
      <rect x="110" y="268" width="580" height="7" rx="3.5" />
      <rect x="110" y="284" width="520" height="7" rx="3.5" />
      <rect x="110" y="300" width="556" height="7" rx="3.5" />
      <rect x="760" y="268" width="380" height="7" rx="3.5" />
      <rect x="760" y="284" width="340" height="7" rx="3.5" />
      <rect x="760" y="300" width="300" height="7" rx="3.5" />
    </g>

    <line x1="110" y1="324" x2="1170" y2="324" stroke="#f1f5f9" stroke-width="1" />
    <text x="110" y="346" font-family="'Courier New', Courier, monospace" font-size="11" fill="#94a3b8" letter-spacing="3">WRITE · STYLE · CHECK · EXPORT</text>
    <text x="1170" y="346" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="11" fill="#1d6ff2" letter-spacing="3">VERSION 1.1.1</text>
  </g>
</svg>
